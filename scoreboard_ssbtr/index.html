<html>
  <head>
    <meta charset="utf-8" />
    <script src="../include/globals.js"></script>
    <link rel="stylesheet" href="../main.css" />
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body class="floating">
    <div class="base_container_outer">
      <div class="base_container">
        <div class="base_container_inner">

          
          <div class="characters_container">
            <div class="p1 character_container"></div>
            <div class="p2 character_container"></div>
          </div>
          
          <div class="mid_col">
            <div class="main_content">
              <div class="p1 player container">
                <div class="score"></div>
                <div class="flags_container">
                  <div class="flagcountry"></div>
                  <div class="flagstate"></div>
                </div>
                <div class="name_twitter">
                  <div class="player_info"></div>
                </div>
                <div class="sponsor_icon"></div>
              </div>

              <div class="set_meta">
                <div class="phase-container">
                  <div class="wave-decoration"></div>
                  <div class="phase"></div>
                  <div class="wave-decoration"></div>
                </div>
                <div class="match"></div>
                <div class="best_of"></div>
              </div>
              
              <div class="p2 player container">
                <div class="score"></div>
                <div class="flags_container">
                  <div class="flagcountry"></div>
                  <div class="flagstate"></div>
                </div>
                <div class="name_twitter">
                  <div class="player_info"></div>
                </div>
                <div class="sponsor_icon"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
